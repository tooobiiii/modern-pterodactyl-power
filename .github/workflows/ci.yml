name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-javascript:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    # The action talks to a live panel, so every step is skipped unless the
    # repository (or environment) provides credentials. Pull requests from
    # forks never see secrets and therefore never power-cycle a server.
    env:
      PANEL_URL: ${{ secrets.PANEL_URL }}
      BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
      SERVER_ID: ${{ secrets.SERVER_ID }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-action
        if: env.PANEL_URL != '' && env.BEARER_TOKEN != '' && env.SERVER_ID != ''
        uses: ./
        with:
          panel-url: ${{ env.PANEL_URL }}
          bearer-token: ${{ env.BEARER_TOKEN }}
          server-id: ${{ env.SERVER_ID }}
          action: restart

      - name: Print Output
        id: output
        if: steps.test-action.outcome == 'success'
        run: |
          echo "signal: ${{ steps.test-action.outputs.signal }}"
          echo "state: ${{ steps.test-action.outputs.state }}"
