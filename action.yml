name: Modern Pterodactyl Power
description:
  An action that is built with a modern design, targeting the latest versions of
  the Pterodactyl API.
author: tooobiiii

# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: power
  color: purple

# Define your inputs here.
inputs:
  panel-url:
    description: The URL of your Pterodactyl panel. (https://panel.example.com)
    required: true

  bearer-token:
    description: A Pterodactyl client API key (ptlc_...).
    required: true

  server-id:
    description: The identifier or UUID of the server to perform the action on.
    required: true

  action:
    description: The power signal to send (start, stop, restart, kill).
    required: false
    default: restart

# Define your outputs here.
outputs:
  signal:
    description: The power signal that was sent to the panel.

  state:
    description:
      The power state reported by the panel right after the signal was
      delivered, e.g. `starting` or `running`. Empty if it could not be read.

runs:
  using: node24
  main: dist/index.js
